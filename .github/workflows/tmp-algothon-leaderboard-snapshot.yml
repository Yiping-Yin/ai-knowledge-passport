name: Temporary Algothon leaderboard snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/tmp_capture_algothon_leaderboard.py
      - tmp/algothon-leaderboard-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Capture public leaderboard
        run: python tools/tmp_capture_algothon_leaderboard.py

      - name: Upload leaderboard snapshot
        uses: actions/upload-artifact@v4
        with:
          name: algothon-leaderboard-snapshot
          retention-days: 2
          path: algothon_leaderboard_snapshot
